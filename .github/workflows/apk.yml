name: Generate APK

env:
  main_project_module: app

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set TAG
        run: |
          echo "version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' ${{ env.main_project_module }}/build.gradle.kts)" >> $GITHUB_ENV

      - name: Use JDK
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Build
        env:
          STORE: ${{ secrets.STORE }}
          LOCAL: ${{ secrets.LOCAL }}
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          if [ -n "$STORE" ]; then
            echo "$STORE" | base64 -d > upload.jks
            echo "$LOCAL" | base64 -d > local.properties
          else
            # no signing secrets (e.g. a fork): sign with a throwaway key so the apk is installable
            keytool -genkeypair -keystore upload.jks -storepass android -keypass android \
              -alias release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Unofficial build"
            printf 'storeFile=%s\nstorePassword=android\nkeyAlias=release\nkeyPassword=android\n' \
              "$PWD/upload.jks" > local.properties
            echo "tag_suffix=-unofficial.${{ github.run_number }}" >> $GITHUB_ENV
          fi
          chmod +x ./gradlew;
          ./gradlew assembleRelease bundleRelease --stacktrace
          rm upload.jks local.properties

      - name: Publish (GitHub)
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.version }}${{ env.tag_suffix }}
          tag_name: v${{ env.version }}${{ env.tag_suffix }}
          files: |
            ${{ env.main_project_module }}/build/outputs/apk/release/app-release.apk
            ${{ env.main_project_module }}/build/outputs/bundle/release/app-release.aab
