name: Generate APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"
      - name: Compile check
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileReleaseKotlin :app:processReleaseMainManifest --stacktrace
